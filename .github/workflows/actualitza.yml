name: Actualitza les dades

on:
  schedule:
    - cron: "17 6 20 * *"     # dia 20 de cada mes, 06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "raw/acled/**"
      - "config/**"
      - "editorial/**"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: actualitza
  cancel-in-progress: false

jobs:
  actualitza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Baixa l'UCDP
        id: ucdp
        run: python scripts/fetch_ucdp.py
        continue-on-error: true   # si falla, es manté el darrer build/ucdp.json

      - name: Baixa l'HDX HAPI
        id: hapi
        run: python scripts/fetch_hapi.py
        continue-on-error: true   # si falla, es manté el darrer build/hapi.json

      - name: Llegeix ACLED
        run: python scripts/parse_acled.py

      - name: Construeix les dades i l'informe
        run: python scripts/build.py

      - name: Desa els canvis
        run: |
          git config user.name "atles-bot"
          git config user.email "atles-bot@users.noreply.github.com"
          git add build site/data informe
          if git diff --cached --quiet; then
            echo "Sense canvis"
          else
            git commit -m "Actualització de dades $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Mostra l'informe
        if: always()
        run: |
          {
            if [ "${{ steps.ucdp.outcome }}" != "success" ]; then echo "> ⚠️ **No s'ha pogut baixar l'UCDP.** Es mantenen les dades anteriors."; echo; fi
            if [ "${{ steps.hapi.outcome }}" != "success" ]; then echo "> ⚠️ **No s'ha pogut baixar l'HDX HAPI.** Es mantenen les dades anteriors."; echo; fi
            cat informe/darrer_informe.md
          } >> "$GITHUB_STEP_SUMMARY"
